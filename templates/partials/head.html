<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description"
		content="{{ pageDescription }}" />
	<meta name="theme-color" content="#f2f0e8" />
	<title>{{ pageTitle }}</title>
	{{ seoLinks }}
	<link rel="icon" href="{{ assetPrefix }}public/img/logo.svg" type="image/svg+xml" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="{{ assetPrefix }}public/css/style.css" />
	<script src="{{ assetPrefix }}public/js/app.js" defer></script>
	{{ pageScripts }}
	{{ pageStyles }}
</head>
